[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srag-agent"
version = "0.1.0"
description = "Agente que gera um relatório sobre SRAG a partir do Open DATASUS, com métricas calculadas em código."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.3",
    "matplotlib==3.11.0",
    "httpx==0.28.1",
    "feedparser==6.0.14",
    "langgraph==1.2.22",
    "langchain-core==1.8.3",
    "langchain-anthropic==1.7.10",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.8.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
